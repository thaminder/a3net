; A3Net - Netzwerk-Fix fuer Anstoss 3
; Diese Datei gehoert zusammen mit dinput.dll in den Spielordner (neben anstoss3.exe).

[A3Net]
; 1 = A3Net aktiv, 0 = aus (das Spiel nutzt dann wieder das originale DirectPlay)
Enabled=1

; TCP-Port fuer das Spiel. Der HOST muss diesen Port im Router freigeben
; (Portweiterleitung TCP 47624 -> PC des Hosts), falls UPnP nicht klappt.
; Beide Spieler muessen denselben Port eingestellt haben.
Port=47624

; Feste Adresse des Hosts. Wenn gesetzt, erscheint beim Beitreten kein Dialog.
; Beispiele: JoinAddress=85.12.34.56   JoinAddress=meinfreund.ddns.net:47624
JoinAddress=

; 1 = beim Suchen nach Spielen nach der IP-Adresse fragen (wenn JoinAddress leer ist)
AskForAddress=1

; 1 = zusaetzlich im lokalen Netzwerk (LAN) per Broadcast suchen (UDP, gleicher Port)
LanBroadcast=1

; 1 = als Host versuchen, den Port automatisch per UPnP im Router zu oeffnen
UPnP=1

; Sekunden ohne Lebenszeichen, nach denen eine Verbindung als verloren gilt
Timeout=30

; Protokoll in a3net.log (sehr hilfreich bei Problemen). LogVerbose=1 protokolliert jede Nachricht.
Log=1
LogVerbose=0

; Wird automatisch mit der zuletzt eingegebenen Adresse gefuellt
LastAddress=
